name: tag test

on:
  workflow_dispatch:
env:
  LATEST_TAG: latest  # 默认值，非手动触发时生效

jobs:
  your-job:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 必须！获取完整历史记录

    - name: Get tag version
      run: |
        # 如果是手动触发 (workflow_dispatch)
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          # 获取所有 Tag（确保包含远程 Tag）
          git fetch --tags
          # 按版本号排序获取最新 Tag（兼容语义化版本）
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1 || echo "nightly")

          # 去掉 Tag 名称中的 'v' 前缀
          VERSION="${LATEST_TAG#v}"
        else
         # 原有逻辑：从推送的 Tag 中提取版本号
         TAG_VERSION="${GITHUB_REF##*/}"
         VERSION="${TAG_VERSION#v}"
        fi

        # 处理无 Tag 的情况（可选：报错或默认值）
        if [ -z "$VERSION" ]; then
          echo "::error::No valid tag found!"
          VERSION="0.0.0"
        fi

        # 将版本号写入环境变量
        echo "VERSION=$VERSION" >> $GITHUB_ENV

        echo "Final version: $VERSION"
        echo "Final LATEST_TAG: $LATEST_TAG"

    - name: Write version to resources/version
      run: echo $Version > resources/version


    - name: Set LATEST_TAG (Manual Trigger)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        # 获取远程所有 Tag
        git fetch --tags
        # 按版本号排序获取最新 Tag
        LATEST_TAG=$(git tag --sort=-v:refname | head -n 1 || echo "")
        # 处理无 Tag 的情况（保留默认值或报错）
        if [ -z "$LATEST_TAG" ]; then
          echo "::warning::No tags found, keeping default LATEST_TAG=$LATEST_TAG"
        else
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
        fi
        echo "Final LATEST_TAG: $LATEST_TAG"
        
    - name: Other Steps
      run: |
        echo "当前 LATEST_TAG: ${{ env.LATEST_TAG }}"
    - name: Debug Output
      run: |
        echo "最终生效的 LATEST_TAG: ${{ env.LATEST_TAG }}"


